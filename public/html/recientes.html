<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CampusTrade - Recientes</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <header>
    <img src="../assets/img/campustrade-logo.png" class="logo-izq">
    <img src="../assets/img/upmh.png" class="logo-der">
    <nav class="navbar">
      <a href="inicio.html">Inicio</a>
      <a href="compra.html">Compra</a>
      <a href="recientes.html" class="active">Recientes</a>
      <a href="categorias.html">Categorías</a>
      <a href="trueque.html">Trueque</a>
      <a href="chats.html">Chats</a>
      <a href="publicar.html">Publicar</a>
      <a href="cuenta.html">Cuenta</a>
    </nav>
  </header>

  <main>

    <div class="hero-section">
      <h1>Publicaciones recientes</h1>
      <p>Últimos artículos subidos por la comunidad</p>
    </div>

    <section>
      <div class="productos">

        <!-- COMPRA -->
        <div class="producto">
          <div class="producto-imagen" style="background: linear-gradient(135deg, #b477ec 0%, #764ba2 100%);"">
            <img src="../assets/img/Calculadora.jpg" class="img-producto">
            <span class="producto-badge">Compra</span>
          </div>

          <div class="producto-info">
            <div class="producto-categoria">Escolar</div>
            <h3 class="producto-titulo">Calculadora Científica Casio</h3>

            <div class="producto-footer">
              <span class="producto-precio">$350</span>
              <button>Ver</button>
            </div>
          </div>
        </div>

        <!-- TRUEQUE -->
        <div class="producto">
          <div class="producto-imagen" style="background: linear-gradient(135deg, #b477ec 0%, #764ba2 100%);"">
            <img src="../assets/img/Libro.jpg" class="img-producto">
            <span class="producto-badge trueque">Trueque</span>
          </div>

          <div class="producto-info">
            <div class="producto-categoria">Libros</div>
            <h3 class="producto-titulo">Libro de Cálculo</h3>

            <div class="producto-footer">
              <span class="producto-precio">Intercambio</span>
              <button>Ver</button>
            </div>
          </div>
        </div>

      </div>
    </section>

  </main>

</body>
</html>
